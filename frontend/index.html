<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SunoSaathi – ISL Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    #controls {
      background: white;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    #viewer {
      margin-top: 30px;
    }

    img {
      max-width: 320px;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div id="controls">
  <p><b>Hearing User Page</b></p>
  <input type="file" id="audioInput" accept="audio/*">
  <button onclick="sendAudio()">Translate & Play</button>
</div>

<div id="viewer">
  <img id="signImage" src="" alt="ISL Sign">
</div>

<script>
function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function sendAudio() {
  const fileInput = document.getElementById("audioInput");
  const file = fileInput.files[0];

  if (!file) {
    alert("Please select an audio file");
    return;
  }

  const formData = new FormData();
  formData.append("file", file); // MUST be "file"

  const response = await fetch("http://127.0.0.1:8000/translate", {
    method: "POST",
    body: formData
  });

  const data = await response.json();
  console.log(data);

  playSequence(data.sequence); // ✅ FIXED
}

async function playSequence(sequence) {
  const img = document.getElementById("signImage");

  for (const sign of sequence) {
    img.src = `assets/${sign}.png`;
    await wait(1200);
  }
}
</script>


</body>
</html>
