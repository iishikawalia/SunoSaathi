<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SunoSaathi – ISL Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    #controls {
      background: white;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    #viewer {
      margin-top: 30px;
    }

    img {
      max-width: 320px;
      height: auto;
      border-radius: 8px;
    }
    #confidence-container {
      width: 300px;
      height: 12px;
      background: #ddd;
      border-radius: 6px;
      margin: 10px auto;
      overflow: hidden;
      display: none;
    }

    #confidence-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #81c784);
      transition: width 0.1s linear;
    }

    #isl-strip-container {
    margin: 20px auto;
    width: 90%;
    overflow-x: auto;
    white-space: nowrap;
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  #isl-strip {
    display: flex;
    gap: 12px;
  }

  .isl-thumb {
    width: 90px;
    height: auto;
    border-radius: 6px;
    opacity: 0.4;
    transition: all 0.3s ease;
  }

  .isl-thumb.active {
    opacity: 1;
    transform: scale(1.1);
    border: 3px solid #4caf50;
  }

</style>
</head>

<body>

<div id="controls">
  <p><b>Hearing User Page</b></p>
</div>
<!--ISL Image-->
<div id="viewer">
  <img id="signImage" src="" alt="ISL Sign">
</div>
<!-- ISL Auto-scroll strip -->
<div id="isl-strip-container">
  <div id="isl-strip"></div>
</div>

<button onclick="startRecording()">🎙 Start</button>
<button onclick="stopRecording()">⏹ Stop</button>
<div id="status" style="margin-top:15px; font-weight:bold; color:green;">
  Idle
</div>
<div id="live-captions" style="
  margin-top: 12px;
  padding: 10px;
  width: 80%;
  margin-left: auto;
  margin-right: auto;
  background: #ffffff;
  border-radius: 6px;
  min-height: 40px;
  font-size: 18px;
  color: #333;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
">
  <i>Live captions will appear here...</i>
</div>

<div id="confidence-container">
  <div id="confidence-bar"></div>
</div>


<script>
const islStrip = document.getElementById("isl-strip");
let audioContext = null;
let analyser = null;
let micSource = null;
let volumeAnimationId = null;

let isPlaying = false;
let mediaRecorder = null;
let audioChunks = [];
let recognition = null;

const img = document.getElementById("signImage");
const captionsBox = document.getElementById("live-captions");

/* ---------- Helpers ---------- */
function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* ---------- UI ---------- */
function showListeningUI() {
  document.getElementById("status").innerText = "🎤 Listening...";
  document.getElementById("status").style.color = "green";
  document.getElementById("confidence-container").style.display = "block";
  captionsBox.innerHTML = "<i>Listening...</i>";
}

function showProcessingUI() {
  document.getElementById("status").innerText = "⏳ Processing...";
  document.getElementById("status").style.color = "orange";
}

function stopUI() {
  document.getElementById("status").innerText = "✅ Done";
  document.getElementById("status").style.color = "green";
  document.getElementById("confidence-container").style.display = "none";
}

/* ---------- Volume Meter ---------- */
function startVolumeMeter(stream) {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  audioContext.resume();

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;

  micSource = audioContext.createMediaStreamSource(stream);
  micSource.connect(analyser);

  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  const bar = document.getElementById("confidence-bar");

  function updateVolume() {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    bar.style.width = Math.min(100, (sum / dataArray.length) * 1.2) + "%";
    volumeAnimationId = requestAnimationFrame(updateVolume);
  }
  updateVolume();
}

function stopVolumeMeter() {
  if (volumeAnimationId) cancelAnimationFrame(volumeAnimationId);
  if (audioContext) audioContext.close();
}

/* ---------- START RECORDING ---------- */
async function startRecording() {
  showListeningUI();
  audioChunks = [];

  /* ---- LIVE CAPTIONING ---- */
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = true;
    recognition.continuous = true;

    recognition.onresult = event => {
      let transcript = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      captionsBox.innerText = transcript;
    };

    recognition.start();
  } else {
    captionsBox.innerText = "Live captions not supported in this browser.";
  }

  /* ---- MIC + RECORDING ---- */
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  startVolumeMeter(stream);

  mediaRecorder = new MediaRecorder(stream, {
    mimeType: "audio/webm;codecs=opus"
  });

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.start();
}

/* ---------- STOP RECORDING ---------- */
async function stopRecording() {
  if (recognition) recognition.stop();
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }

  stopVolumeMeter();
  showProcessingUI();

  mediaRecorder.onstop = async () => {
    try {
      const audioBlob = new Blob(audioChunks, {
        type: "audio/webm;codecs=opus"
      });

      const formData = new FormData();
      formData.append("file", audioBlob);

      const response = await fetch("http://127.0.0.1:8000/translate", {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      captionsBox.innerHTML = "<b>Final:</b> " + data.clean_text;
      playSequence(data.sequence);
    } catch (err) {
      console.error(err);
      captionsBox.innerText = "Error processing speech.";
    } finally {
      stopUI();
    }
  };
}

/* ---------- PLAY ISL IMAGES ---------- */
async function playSequence(sequence) {
  if (!sequence || isPlaying) return;
  isPlaying = true;

  // Clear previous strip
  islStrip.innerHTML = "";

  // Create thumbnails
  sequence.forEach(sign => {
    const img = document.createElement("img");
    img.src = `assets/${sign}.png`;
    img.className = "isl-thumb";
    islStrip.appendChild(img);
  });

  const thumbs = document.querySelectorAll(".isl-thumb");

  for (let i = 0; i < sequence.length; i++) {
    // Main large image
    img.src = `assets/${sequence[i]}.png`;

    // Highlight current thumb
    thumbs.forEach(t => t.classList.remove("active"));
    thumbs[i].classList.add("active");

    // Auto-scroll to current thumb
    thumbs[i].scrollIntoView({
      behavior: "smooth",
      inline: "center",
      block: "nearest"
    });

    await wait(1000);
  }

  isPlaying = false;
}

</script>

</body>
</html>
