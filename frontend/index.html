<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SunoSaathi – ISL Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    #controls {
      background: white;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    #viewer {
      margin-top: 30px;
    }

    img {
      max-width: 320px;
      height: auto;
      border-radius: 8px;
    }
    #confidence-container {
      width: 300px;
      height: 12px;
      background: #ddd;
      border-radius: 6px;
      margin: 10px auto;
      overflow: hidden;
      display: none;
    }

  #confidence-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4caf50, #81c784);
  transition: width 0.1s linear;
}



</style>
</head>

<body>

<div id="controls">
  <p><b>Hearing User Page</b></p>
</div>

<div id="viewer">
  <img id="signImage" src="" alt="ISL Sign">
</div>
<button onclick="startRecording()">🎙 Start</button>
<button onclick="stopRecording()">⏹ Stop</button>
<div id="status" style="margin-top:15px; font-weight:bold; color:green;">
  Idle
</div>
<div id="confidence-container">
  <div id="confidence-bar"></div>
</div>


<script>
let audioContext = null;
let analyser = null;
let micSource = null;
let volumeAnimationId = null;

let isPlaying = false;
let mediaRecorder = null;
let audioChunks = [];
let recognition = null;

const img = document.getElementById("signImage");

/* ---------- Helpers ---------- */
function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* ---------- UI ---------- */
function showListeningUI() {
  document.getElementById("status").innerText = "🎤 Listening...";
  document.getElementById("status").style.color = "green";
  document.getElementById("confidence-container").style.display = "block";
}

function showProcessingUI() {
  document.getElementById("status").innerText = "⏳ Processing...";
  document.getElementById("status").style.color = "orange";
}

function stopUI() {
  document.getElementById("status").innerText = "✅ Done";
  document.getElementById("status").style.color = "green";
  document.getElementById("confidence-container").style.display = "none";
}

/* ---------- Volume Meter ---------- */
function startVolumeMeter(stream) {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();

  // 🔴 CRITICAL FIX
  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;

  micSource = audioContext.createMediaStreamSource(stream);
  micSource.connect(analyser);

  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  const bar = document.getElementById("confidence-bar");

  function updateVolume() {
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }

    const avg = sum / dataArray.length;
    bar.style.width = Math.min(100, avg * 1.2) + "%";

    volumeAnimationId = requestAnimationFrame(updateVolume);
  }

  updateVolume();
}

function stopVolumeMeter() {
  if (volumeAnimationId) cancelAnimationFrame(volumeAnimationId);
  volumeAnimationId = null;

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }
}

/* ---------- START RECORDING ---------- */
async function startRecording() {
  showListeningUI();
  audioChunks = [];

  // Browser ASR (optional)
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.start();
  }

  // Mic stream
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  startVolumeMeter(stream);

  mediaRecorder = new MediaRecorder(stream, {
    mimeType: "audio/webm;codecs=opus"
  });

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.start();
}

/* ---------- STOP RECORDING ---------- */
async function stopRecording() {
  if (recognition) recognition.stop();
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }

  stopVolumeMeter();
  showProcessingUI();

  mediaRecorder.onstop = async () => {
    try {
      const audioBlob = new Blob(audioChunks, {
        type: "audio/webm;codecs=opus"
      });

      const formData = new FormData();
      formData.append("file", audioBlob);

      const response = await fetch("http://127.0.0.1:8000/translate", {
        method: "POST",
        body: formData
      });

      if (!response.ok) throw new Error("Backend error");

      const data = await response.json();
      playSequence(data.sequence);
    } catch (err) {
      console.error(err);
    } finally {
      stopUI();
    }
  };
}

/* ---------- PLAY ISL IMAGES ---------- */
async function playSequence(sequence) {
  if (!sequence || sequence.length === 0 || isPlaying) return;

  isPlaying = true;

  for (const sign of sequence) {
    img.src = `assets/${sign}.png`;
    await wait(1000);
  }

  isPlaying = false;
}
</script>




</body>
</html>
